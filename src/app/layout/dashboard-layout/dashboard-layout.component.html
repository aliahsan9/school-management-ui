<div class="container-fluid dashboard-layout">

  <!-- TOP BAR -->
  <div class="row topbar align-items-center mb-3">

    <div class="col-12 col-md-6">
      <h5 class="m-0 fw-bold">School ERP Dashboard</h5>
    </div>

    <div class="col-12 col-md-6 text-md-end mt-2 mt-md-0">

      <button class="btn btn-sm btn-outline-primary"
              (click)="loadDashboard()">
        Refresh Data
      </button>

    </div>

  </div>

  <!-- KPI CARDS -->
  <div class="row g-3">

    <div class="col-6 col-md-4 col-lg-2"
         *ngFor="let card of statsCards">

      <div class="card stat-card shadow-sm text-center p-3">

        <h6 class="text-muted">{{ card.title }}</h6>
        <h4 class="fw-bold">{{ card.value }}</h4>

      </div>

    </div>

  </div>

  <!-- CHARTS -->
  <div class="row g-4 mt-2">

    <div class="col-12 col-lg-6">

      <div class="card p-3 shadow-sm">

        <h6 class="mb-3">Students Growth</h6>
        <canvas id="studentsChart"></canvas>

      </div>

    </div>

    <div class="col-12 col-lg-6">

      <div class="card p-3 shadow-sm">

        <h6 class="mb-3">Fee Collection</h6>
        <canvas id="feesChart"></canvas>

      </div>

    </div>

  </div>

  <!-- ATTENDANCE -->
  <div class="row g-4 mt-2">

    <div class="col-12">

      <div class="card p-3 shadow-sm">

        <h6 class="mb-3">Attendance Overview</h6>
        <canvas id="attendanceChart"></canvas>

      </div>

    </div>

  </div>

</div>
