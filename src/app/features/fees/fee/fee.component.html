<div class="container-fluid fee-page">

  <div class="row g-4">

    <!-- FORM -->
    <div class="col-lg-4">

      <div class="card shadow-sm p-3">

        <h4 class="mb-3">
          {{ isEditMode ? 'Update Fee' : 'Add Fee' }}
        </h4>

        <form [formGroup]="feeForm" (ngSubmit)="submit()">

          <input class="form-control mb-2"
                 type="number"
                 placeholder="Student ID"
                 formControlName="studentId">

          <input class="form-control mb-2"
                 type="number"
                 placeholder="Amount"
                 formControlName="amount">

          <input class="form-control mb-2"
                 type="date"
                 formControlName="dueDate">

          <select class="form-select mb-2"
                  formControlName="status">

            <option value="Pending">Pending</option>
            <option value="Paid">Paid</option>
            <option value="Overdue">Overdue</option>

          </select>

          <button class="btn btn-primary w-100">
            {{ isEditMode ? 'Update' : 'Save' }}
          </button>

          <button type="button"
                  class="btn btn-secondary w-100 mt-2"
                  (click)="reset()">
            Reset
          </button>

        </form>

      </div>

    </div>

    <!-- TABLE -->
    <div class="col-lg-8">

      <div class="card shadow-sm p-3">

        <h4 class="mb-3">Fee Records</h4>

        <div class="table-responsive">

          <table class="table table-hover align-middle">

            <thead class="table-dark">
              <tr>
                <th>Student ID</th>
                <th>Amount</th>
                <th>Due Date</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>

            <tbody>

              <tr *ngFor="let f of fees">

                <td>{{ f.studentId }}</td>
                <td>{{ f.amount }}</td>
                <td>{{ f.dueDate | date }}</td>

                <td>
                  <span class="badge"
                        [ngClass]="{
                          'bg-success': f.status === 'Paid',
                          'bg-warning text-dark': f.status === 'Pending',
                          'bg-danger': f.status === 'Overdue'
                        }">
                    {{ f.status }}
                  </span>
                </td>

                <td>

                  <button class="btn btn-sm btn-warning me-2"
                          (click)="edit(f)">
                    Edit
                  </button>

                  <button class="btn btn-sm btn-danger"
                          (click)="delete(f.id!)">
                    Delete
                  </button>

                </td>

              </tr>

            </tbody>

          </table>

        </div>

      </div>

    </div>

  </div>

</div>
