<div class="container-fluid fee-page">

  <div class="row g-4">

    <!-- FORM -->
    <div class="col-lg-4">

      <div class="card shadow-sm p-3">

        <h4 class="mb-3">Add Fee</h4>

        <form [formGroup]="feeForm" (ngSubmit)="submit()">

          <input class="form-control mb-2"
                 type="text"
                 placeholder="Student ID"
                 formControlName="studentId">

          <input class="form-control mb-2"
                 type="text"
                 placeholder="Title"
                 formControlName="title">

          <input class="form-control mb-2"
                 type="number"
                 placeholder="Amount"
                 formControlName="amount">

          <input class="form-control mb-2"
                 type="date"
                 formControlName="dueDate">

          <button class="btn btn-primary w-100">
            Save Fee
          </button>

        </form>

      </div>

    </div>

    <!-- TABLE -->
    <div class="col-lg-8">

      <div class="card shadow-sm p-3">

        <h4 class="mb-3">Fee Records</h4>

        <div class="table-responsive">

          <table class="table table-hover align-middle">

            <thead class="table-dark">
              <tr>
                <th>Student</th>
                <th>Title</th>
                <th>Amount</th>
                <th>Paid</th>
                <th>Remaining</th>
                <th>Status</th>
                <th>Due Date</th>
              </tr>
            </thead>

            <tbody>

              <tr *ngFor="let f of fees">

                <td>{{ f.studentName }}</td>
                <td>{{ f.title }}</td>
                <td>{{ f.amount }}</td>
                <td>{{ f.paidAmount }}</td>
                <td>{{ f.remainingAmount }}</td>

                <td>
                  <span class="badge"
                        [ngClass]="{
                          'bg-success': f.status === 'Paid',
                          'bg-warning text-dark': f.status === 'Pending',
                          'bg-danger': f.status === 'Partial'
                        }">
                    {{ f.status }}
                  </span>
                </td>

                <td>{{ f.dueDate | date }}</td>

              </tr>

            </tbody>

          </table>

        </div>

      </div>

    </div>

  </div>

</div>
