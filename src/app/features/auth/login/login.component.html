<div class="login-page">

    <div class="login-card">

        <h2 class="text-center mb-4">
            Login
        </h2>

        <form
          [formGroup]="loginForm"
          (ngSubmit)="onSubmit()">

            <div class="mb-3">

                <label>Email</label>

                <input
                  type="email"
                  class="form-control"
                  formControlName="email">

            </div>

            <div class="mb-4">

                <label>Password</label>

                <input
                  type="password"
                  class="form-control"
                  formControlName="password">

            </div>

            <button
              class="btn btn-primary w-100"
              [disabled]="loading">

              {{
                loading
                ? 'Logging In...'
                : 'Login'
              }}

            </button>

        </form>

    </div>

</div>
