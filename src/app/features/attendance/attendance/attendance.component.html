<div class="container-fluid attendance-page">

  <div class="row g-4">

    <!-- FORM -->
    <div class="col-lg-4">

      <div class="card shadow-sm p-3">

        <h4 class="mb-3">
          Mark Attendance
        </h4>

        <form
          [formGroup]="attendanceForm"
          (ngSubmit)="submit()"
        >

          <!-- CLASS ID -->
          <input
            class="form-control mb-3"
            type="text"
            placeholder="Class ID"
            formControlName="classId"
          >

          <!-- STUDENT ID -->
          <input
            class="form-control mb-3"
            type="text"
            placeholder="Student ID"
            formControlName="studentId"
          >

          <!-- DATE -->
          <input
            class="form-control mb-3"
            type="date"
            formControlName="date"
          >

          <!-- STATUS -->
          <select
            class="form-select mb-3"
            formControlName="status"
          >

            <option [value]="0">
              Present
            </option>

            <option [value]="1">
              Absent
            </option>

            <option [value]="2">
              Late
            </option>

            <option [value]="3">
              Leave
            </option>

          </select>

          <button
            class="btn btn-primary w-100"
            [disabled]="loading"
          >

            {{ loading ? 'Saving...' : 'Mark Attendance' }}

          </button>

          <button
            type="button"
            class="btn btn-secondary w-100 mt-2"
            (click)="reset()"
          >

            Reset

          </button>

          <button
            type="button"
            class="btn btn-dark w-100 mt-2"
            (click)="loadAttendance()"
          >

            Load Attendance

          </button>

        </form>

      </div>

    </div>

    <!-- TABLE -->
    <div class="col-lg-8">

      <div class="card shadow-sm p-3">

        <h4 class="mb-3">
          Attendance Records
        </h4>

        <div class="table-responsive">

          <table
            class="table table-hover align-middle"
          >

            <thead class="table-dark">

              <tr>

                <th>Student Name</th>

                <th>Date</th>

                <th>Status</th>

              </tr>

            </thead>

            <tbody>

              <tr
                *ngFor="
                  let a of attendanceList
                "
              >

                <td>
                  {{ a.studentName }}
                </td>

                <td>
                  {{ a.date | date }}
                </td>

                <td>

                  <span
                    class="badge"
                    [ngClass]="{

                      'bg-success':
                        a.status === 'Present',

                      'bg-danger':
                        a.status === 'Absent',

                      'bg-warning text-dark':
                        a.status === 'Late',

                      'bg-info':
                        a.status === 'Leave'

                    }"
                  >

                    {{ a.status }}

                  </span>

                </td>

              </tr>

              <tr
                *ngIf="
                  attendanceList.length === 0
                "
              >

                <td
                  colspan="3"
                  class="text-center text-muted"
                >

                  No attendance records found

                </td>

              </tr>

            </tbody>

          </table>

        </div>

      </div>

    </div>

  </div>

</div>
